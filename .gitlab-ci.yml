# Skip pipelines for dev-version tags (e.g. v2026.031116.5817) created
# automatically by the upload:dev release job.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d{4}\.\d{6}\.\d{4}$/
      when: never
    - when: always

# Scheduled pipelines exist for exactly one purpose: the prod synthetic monitor
# (`e2e:prod`, see below). Every other job opts out with this guard so a
# 3-hourly schedule never rebuilds binaries, re-runs the dev e2e, or publishes
# a dev release. `e2e:prod` and `upload:prod` need no guard — they are gated on
# $CI_COMMIT_TAG, which a schedule does not set.
.not-on-schedule: &not-on-schedule
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

# Shared step: clone fusebase-apps-cli-release-scripts and export RELEASE_SCRIPTS.
# Uses CI_JOB_TOKEN for authentication (no extra CI variables needed).
# Requires "Allow CI job token access" enabled on the apps-cli-release-scripts project.
.clone-release-scripts: &clone-release-scripts
  - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.nimbusweb.co/cli/apps-cli-release-scripts.git" /tmp/release-scripts
  - export RELEASE_SCRIPTS=/tmp/release-scripts
  - export PROJECT_ROOT="$CI_PROJECT_DIR"

# Validate skills with skills-ref (https://github.com/agentskills/agentskills/tree/main/skills-ref).
# Runs on MR and branch when project-template/.claude/skills or the script change.
validate-skills:
  image: python:3.12-bookworm
  rules:
    # `changes:` always evaluates true on scheduled pipelines, so without this
    # guard the skill validation would run every 3 hours for nothing.
    - *not-on-schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - project-template/.claude/skills/**/*
        - scripts/validate-skills.ts
    - if: $CI_COMMIT_BRANCH
      changes:
        - project-template/.claude/skills/**/*
        - scripts/validate-skills.ts
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL=$HOME/.bun && export PATH=$BUN_INSTALL/bin:$PATH
    - git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills
    - pip install -e /tmp/agentskills/skills-ref
    - bun install --frozen-lockfile
  script:
    - bun run skills:validate

# Build CLI binaries on every commit (MR and branch pushes).
# On the default branch, BUILD_CHANNEL=dev causes build.sh to embed a timestamp
# version into the binary and save it to build/.dev-version for the upload jobs.
build:
  image: oven/bun:1.3.11
  rules:
    - *not-on-schedule
    # Everything else keeps the pre-rules default (build ran on every pipeline).
    - when: on_success
  before_script:
    # oven/bun image does not include zip, git, wine, or python3-pefile; prebuild
    # needs all of them. wine64 runs rcedit-x64.exe to embed the FuseBase icon,
    # and python3-pefile patches bun's residual IDI_MYICON resource so Windows
    # never resolves it to our 16x16 entry (see scripts/fix-windows-idi-myicon.py).
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git zip unzip wget nsis default-jre-headless wine64 python3 python3-pefile
    # Download and install the INetC NSIS plugin
    - wget "https://nsis.sourceforge.io/mediawiki/images/c/c9/Inetc.zip" -O inetc.zip
    - unzip -q inetc.zip -d inetc-plugin
    - cp inetc-plugin/Plugins/x86-unicode/INetC.dll /usr/share/nsis/Plugins/x86-unicode/
    - rm -rf inetc.zip inetc-plugin
    # Clone release scripts
    - *clone-release-scripts
    # Tag pipelines produce prod builds; everything else is dev.
    - export BUILD_CHANNEL=$( [ -n "$CI_COMMIT_TAG" ] && echo prod || echo dev )
    - export UPLOAD_DEV=$( [ -z "$CI_COMMIT_TAG" ] && echo 1 || echo "" )
  script:
    - bun --version
    - bun install --frozen-lockfile
    - bun run build
    # Every Windows artifact (launcher, CLI bin, installer) is signed only on the
    # prod version tag. Resolved once so all signing steps below share one gate.
    # Must run after `bun run build`: get-version.ts reads what build.sh generates.
    - |
      PROD_VERSION_TAG="v$(bun "$RELEASE_SCRIPTS/get-version.ts")"

      if [[ "${SKIP_WINDOWS_SIGNING:-}" == "1" ]]; then
        export SIGN_WINDOWS=""
        echo "Skipping Windows signing because SKIP_WINDOWS_SIGNING=1"
      elif [[ "${CI_COMMIT_TAG:-}" != "$PROD_VERSION_TAG" ]]; then
        export SIGN_WINDOWS=""
        echo "Skipping Windows signing because CI_COMMIT_TAG is not ${PROD_VERSION_TAG}"
      else
        export SIGN_WINDOWS=1
      fi
    # Sign the launcher and the CLI bin BEFORE bundling. Order matters: the
    # installer's signature does not cover the launcher it extracts (that runs
    # later as its own PE), and the CLI bin is downloaded/run on its own during
    # cache-swap updates — so each is signed separately, launcher first.
    - |
      if [[ "${SIGN_WINDOWS:-}" == "1" ]]; then
        LAUNCHER_VERSION=$(cat build/.launcher-version 2>/dev/null | tr -d '[:space:]')
        bun "$RELEASE_SCRIPTS/signing/sign-exe.ts" "build/fusebase-launcher-${LAUNCHER_VERSION}.exe"
        DEV_VERSION=$(cat build/.dev-version 2>/dev/null | tr -d '[:space:]')
        BIN_VERSION=${DEV_VERSION:-$(bun "$RELEASE_SCRIPTS/get-version.ts")}
        bun "$RELEASE_SCRIPTS/signing/sign-exe.ts" "build/fusebase-${BIN_VERSION}.exe"
      fi
    # Bundle the launcher into the installer, then sign the installer.
    - bun "$RELEASE_SCRIPTS/installers/build-installer-win.ts"
    - |
      if [[ "${SIGN_WINDOWS:-}" == "1" ]]; then
        bun "$RELEASE_SCRIPTS/signing/sign-exe.ts" build/installers/win/fusebase-installer-*.exe
      fi
  artifacts:
    name: "fusebase-cli-$CI_COMMIT_REF_SLUG"
    paths:
      - build/
    expire_in: 30 days

# Shared step: install Node.js + npm in the bun image. The CLI under test
# invokes `npm install` from `scaffold`, `init`, and `deploy`, and the smoke
# test's cron entrypoint runs `node dist/cron.js`. The oven/bun image ships
# only bun, so the e2e jobs must provision Node themselves.
.install-node: &install-node
  - apt-get update -qq && apt-get install -y -qq curl ca-certificates
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y -qq nodejs
  - node --version
  - npm --version

# E2E smoke against the dev environment.
# Runs on non-draft MR pipelines and on the default branch — gates `upload:dev`
# so a failed smoke blocks the dev artifact upload.
# Required CI variables (masked + protected, set out-of-band by SRE / Denis):
#   FUSEBASE_DEV_API_KEY, FUSEBASE_TEST_ORG_ID_DEV.
# When the variables are not set, the suite SKIPs cleanly via `e2eEnvAvailable`.
e2e:dev:
  image: oven/bun:1.3.11
  needs:
    - job: build
      artifacts: false
  rules:
    - *not-on-schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    FUSEBASE_API_KEY: $FUSEBASE_DEV_API_KEY
    FUSEBASE_ENV: dev
    FUSEBASE_TEST_ORG_ID: $FUSEBASE_TEST_ORG_ID_DEV
  before_script:
    - *install-node
  script:
    - bun --version
    - bun install --frozen-lockfile
    - bun run test:e2e

# E2E smoke against the prod environment. Two triggers, same job:
#
#   1. Tag pipelines — gates `upload:prod` so a failed smoke blocks the release.
#   2. Scheduled pipelines — the prod **synthetic monitor**. A GitLab pipeline
#      schedule on the default branch (cron `0 */3 * * *`) re-runs the exact
#      same lifecycle every 3 hours, so a prod regression in app deploys is
#      caught between releases rather than at the next tag. The suite creates a
#      product with a backend + sidecar + cron job, deploys it, verifies the
#      live backend over HTTP, then deletes the product via public-api — the
#      nimbus-ai cascade removes the Azure Container App and Container Apps Job.
#      A failed scheduled pipeline is the alert (GitLab notifies the schedule
#      owner); see test/e2e/README.md for setup and triage.
#
# `needs: build` is optional so schedule pipelines — where `build` is skipped by
# the .not-on-schedule guard — still produce a valid pipeline.
#
# Required CI variables (masked + protected, set out-of-band by SRE / Denis):
#   FUSEBASE_PROD_API_KEY, FUSEBASE_TEST_ORG_ID_PROD.
e2e:prod:
  image: oven/bun:1.3.11
  needs:
    - job: build
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    FUSEBASE_API_KEY: $FUSEBASE_PROD_API_KEY
    FUSEBASE_ENV: prod
    FUSEBASE_TEST_ORG_ID: $FUSEBASE_TEST_ORG_ID_PROD
  before_script:
    - *install-node
  script:
    - bun --version
    - bun install --frozen-lockfile
    - bun run test:e2e

# Upload dev artifacts to S3 on every default-branch commit.
# Sets manifest.devVersion to a timestamp (YYYY.mmddhh.mmss).
# manifest.version is preserved (only updated by upload:prod).
# Also creates a GitLab Release tagged with the dev version.
upload:dev:
  image: oven/bun:1
  resource_group: apps-cli-manifest
  needs:
    - job: build
    - job: e2e:dev
      artifacts: false
  variables:
    S3_BUCKET: fusebase-cli-bin
    UPLOAD_DEV: "1"
  rules:
    - *not-on-schedule
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-pip python3-venv
    - python3 -m pip install --break-system-packages awscli
    - *clone-release-scripts
  script:
    - |
      DEV_VERSION=$(cat build/.dev-version 2>/dev/null | tr -d '[:space:]')
      if [[ -n "$DEV_VERSION" ]]; then
        bun "$RELEASE_SCRIPTS/create-release.ts" "$DEV_VERSION"
      fi
    - bash "$RELEASE_SCRIPTS/upload-to-s3.sh"

# Upload prod artifacts and create a GitLab Release when package.json version changes.
# Sets manifest.version to the new semver version.
upload:prod:
  image: oven/bun:1
  resource_group: apps-cli-manifest
  needs:
    - job: build
    - job: e2e:prod
      artifacts: false
  rules:
    - if: $SKIP_RELEASE == "1"
      when: never
    - if: $CI_COMMIT_TAG
  variables:
    S3_BUCKET: fusebase-cli-bin
    UPLOAD_PROD: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-pip python3-venv
    - python3 -m pip install --break-system-packages awscli
    - *clone-release-scripts
  script:
    - bun "$RELEASE_SCRIPTS/create-release.ts"
    - bash "$RELEASE_SCRIPTS/upload-to-s3.sh"
